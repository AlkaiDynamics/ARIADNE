federation_id: GREAT-WORK

registry_policy:
  completeness: OPEN_WORLD
  rule: "Inventory first; classify only when the handling decision is actually made."
  unresolved_is_allowed: true
  current_n_is_not_total_n: true
  repository_identity_does_not_define_project_identity: true
  git_branch_identity_does_not_define_project_identity: true
  project_fork_identity_is_separate: true

projects:
  - project_id: AYLI
    role: EVIDENCE_ATLAS
    status: REGISTERED
    repository: AlkaiDynamics/AYLI
    owns:
      - witnesses
      - variants
      - domain units
      - correspondence mappings
      - generated atlas views
    ariadne_role: provenance_lineage_fork_governance

  - project_id: SUN
    role: THEORY_MODEL_LINEAGE
    status: REGISTERED
    owns:
      - equations
      - operator definitions
      - frozen model snapshots
      - ablations
      - preregistered predictions
      - theory-specific controls
    ariadne_role: snapshot_lineage_validation_dependencies

  - project_id: SATURN
    role: APPLICATION_FORK
    status: REGISTERED
    consumes:
      - pinned SUN snapshot
    owns:
      - instantiation hypotheses
      - generated architecture consequences
      - application controls
      - return proposals
    hard_rule: SATURN_SUCCESS_DOES_NOT_VALIDATE_SUN

  - project_id: SOPHIA
    role: UNRESOLVED
    status: CLASSIFICATION_PENDING
    notes:
      - "Currently functions as a human-values/authority boundary in SATURN framing."
      - "Do not decide yet whether Sophia is a project, subsystem, policy layer, or named role."

  - project_id: ARGO
    aliases: [ARGO_LIFELINE, Lifeline]
    role: UNRESOLVED
    status: CLASSIFICATION_PENDING
    notes:
      - "Operational target/system lineage."
      - "Must remain distinct from MARC-1 until their relationship is explicitly decided."

  - project_id: HARMONIA_OCCULTA
    role: HISTORICAL_HARMONIC_RESEARCH
    status: REGISTERED
    repository: AlkaiDynamics/Harmonia-Occulta

  - project_id: ROSETTAS
    name: R.O.S.E.T.T.A.S.
    role: RECONSTRUCTION_RESEARCH
    status: REGISTERED
    repository: AlkaiDynamics/R.O.S.E.T.T.A.S.

  - project_id: TEMPO_GOLD
    role: TEMPORAL_AUDIT_RESEARCH
    status: REGISTERED_UNSPECIFIED
    repository: AlkaiDynamics/Tempo-Gold

  - project_id: BURGAMOTS
    role: PHYSICAL_COSMOLOGICAL_DYNAMICS
    status: REGISTERED_UNSPECIFIED
    repository: AlkaiDynamics/BURGAMOTS

