distribution_id: ALKAI-GREAT-WORK
distribution_kind: DOWNSTREAM_FEDERATION
repository: AlkaiDynamics/ARIADNE

upstream:
  repository: zhenrez/ARIADNE
  commit: 709f8e7d38a98761c6442cce83663ecaa35b3285
  sync_policy: EXPLICIT_PINNED_UPGRADE

ownership:
  upstream_owns:
    - ariadne_core
    - ariadne.py
    - warden.py
    - generic schemas
    - generic epistemic contracts
    - generic tests
  downstream_owns:
    - profiles/great-work
    - federation
    - checkpoints
    - active research questions
    - project torches
    - project adapters
    - research-state

policy:
  repository_fork_is_not_project_fork: true
  destructive_project_merge: false
  research_data_flows_upstream_automatically: false
  generic_features_return_upstream_by_proposal: true
  upstream_upgrade_requires_explicit_pin: true
  project_registry_is_open_world: true
  unresolved_project_classification_is_allowed: true

project_registry:
  path: federation/projects/registry.yaml
  completeness: OPEN_WORLD
  rule: "Do not infer that unlisted projects do not exist. Inventory first; classify only when the handling decision is actually made."

registered_project_manifests:
  - federation/projects/ayli/project.yaml
  - federation/projects/sun/project.yaml
  - federation/projects/saturn/project.yaml

notes:
  - "Canonical ARIADNE owns reusable mechanism and specification."
  - "This distribution owns Great Work policy, state, fork instances, checkpoints, torches, and adapters."
  - "Project meaning remains project-owned; ARIADNE owns relationships between project states."
  - "BEANS, MARC-1/M1, ARGO, SHARER, MorphIQ, QuestN/Q10, HQ/Neurite, McDuck, WAUSAUKEE and other known lines are retained in the registry without forcing a premature project/fork/subsystem classification."
